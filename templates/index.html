<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipAI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        background: '#111520', /* Exact dark background from image */
                        card: '#1a1d27',
                        border: 'rgba(255, 255, 255, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #111520;
            color: #ffffff;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%);
        }
        
        /* Glassmorphism panel for the main search box */
        .glass-hero {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .gradient-btn {
            background: linear-gradient(to right, #3b82f6, #a855f7);
            transition: opacity 0.2s ease;
        }
        .gradient-btn:hover {
            opacity: 0.9;
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- Header -->
    <header class="w-full max-w-[1200px] mx-auto px-6 py-6 flex items-center justify-between z-20">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg">
                G
            </div>
            <span class="text-xl font-semibold tracking-tight text-white">ClipAI</span>
        </div>
        
        <nav class="hidden md:flex items-center gap-8 text-[15px] text-gray-300 font-medium">
            <a href="#" class="hover:text-white transition-colors">Features</a>
            <a href="#" class="hover:text-white transition-colors">Pricing</a>
            <a href="#" class="hover:text-white transition-colors">API</a>
            <a href="#" class="hover:text-white transition-colors">Account</a>
            <button class="px-5 py-2 rounded-xl border border-gray-600 hover:border-gray-400 text-white transition-colors">
                Try for Free
            </button>
        </nav>
    </header>

    <!-- Main Hero -->
    <main class="w-full max-w-[1200px] mx-auto flex-1 flex flex-col items-center px-4 pt-12 pb-20 z-10">
        
        <!-- Glass Search Box -->
        <div class="glass-hero rounded-[2rem] p-8 w-full max-w-[600px] flex flex-col items-center gap-6 mt-10 relative overflow-hidden mb-16">
            <!-- decorative background blur inside the box -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-purple-500/20 blur-[60px] rounded-full pointer-events-none"></div>

            <form id="analyze-form" class="w-full relative z-10 flex flex-col items-center gap-6">
                
                <div class="w-full relative flex items-center">
                    <svg class="absolute left-4 w-6 h-6 text-red-500" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
                    </svg>
                    <input type="url" id="video-url" required placeholder="Paste YouTube link here" 
                           class="w-full bg-black/20 text-white placeholder-gray-400 rounded-2xl py-4 pl-12 pr-4 border border-white/10 focus:border-purple-500/50 outline-none transition-all text-[15px]">
                </div>

                <button type="submit" id="submit-btn" class="gradient-btn text-white font-semibold py-3 px-8 rounded-xl shadow-lg flex items-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">link</span>
                    Generate Clips
                </button>
            </form>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="hidden flex-col items-center gap-4 mb-16 animate-pulse">
            <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-gray-300 font-medium" id="loading-text">Analyzing video...</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 px-6 py-4 rounded-xl mb-16 max-w-lg text-center">
            <span class="material-symbols-outlined block text-3xl mb-2 mx-auto">error</span>
            <span id="error-message">Failed to generate clips.</span>
        </div>

        <!-- Results Header -->
        <div id="results-header" class="hidden flex-col items-center text-center mb-8">
            <h2 class="text-[22px] font-medium text-gray-300">Generated Clips from: <span class="text-white font-semibold" id="meta-title">"..."</span></h2>
            <p class="text-gray-400 text-sm mt-1.5 font-medium"><span id="meta-duration"></span>, 1080p</p>
        </div>

        <!-- Clips Grid -->
        <div id="clips-grid" class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
            <!-- Cards will be injected here -->
        </div>

    </main>

    <script>
        const form = document.getElementById('analyze-form');
        const urlInput = document.getElementById('video-url');
        const submitBtn = document.getElementById('submit-btn');
        
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const resultsHeader = document.getElementById('results-header');
        const clipsGrid = document.getElementById('clips-grid');
        const errorMessage = document.getElementById('error-message');

        const loadingTexts = [
            "Downloading transcript...",
            "Analyzing with Groq AI...",
            "Scoring viral moments...",
            "Trimming highlights..."
        ];
        let loadingInterval;

        function resetUI() {
            loadingState.classList.add('hidden');
            errorState.classList.add('hidden');
            resultsHeader.classList.add('hidden');
            clipsGrid.innerHTML = '';
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            clearInterval(loadingInterval);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();
            if(!url) return;

            resetUI();
            
            // Show Loading
            loadingState.classList.remove('hidden');
            loadingState.classList.add('flex');
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.5';
            
            let textIdx = 0;
            document.getElementById('loading-text').innerText = loadingTexts[0];
            loadingInterval = setInterval(() => {
                textIdx = (textIdx + 1) % loadingTexts.length;
                document.getElementById('loading-text').innerText = loadingTexts[textIdx];
            }, 3000);

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, num_clips: 6 })
                });

                const data = await response.json();
                clearInterval(loadingInterval);
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to process video.');
                }

                renderResults(data);

            } catch (err) {
                clearInterval(loadingInterval);
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');
                errorState.classList.remove('hidden');
                errorMessage.innerText = err.message;
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        });

        function formatDurationStr(isoStr) {
            let s = isoStr.replace('PT', '').toLowerCase();
            return s;
        }

        function formatSecondsToTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function renderResults(data) {
            resultsHeader.classList.remove('hidden');
            resultsHeader.classList.add('flex');
            
            document.getElementById('meta-title').innerText = `"${data.metadata.title}"`;
            document.getElementById('meta-duration').innerText = formatDurationStr(data.metadata.duration);

            clipsGrid.innerHTML = '';

            if(!data.clips || data.clips.length === 0) {
                clipsGrid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10">No clips found.</div>`;
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
                return;
            }

            data.clips.forEach((clip, index) => {
                const durationSecs = clip.end_seconds - clip.start_seconds;
                const timeLabel = formatSecondsToTime(durationSecs);
                
                const card = document.createElement('div');
                card.className = "bg-card rounded-2xl border border-border overflow-hidden flex flex-col group hover:border-white/20 transition-colors";
                
                card.innerHTML = `
                    <div class="relative w-full aspect-video bg-black/50 overflow-hidden">
                        <img src="${data.metadata.thumbnail}" alt="Thumbnail" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute bottom-2 right-2 bg-black/70 backdrop-blur-md px-2 py-0.5 rounded text-[11px] font-medium text-white border border-white/10">
                            ${timeLabel}
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-1">
                        <h3 class="text-[15px] font-semibold text-white leading-snug line-clamp-2 mb-4 flex-1">
                            ${clip.clip_id_num}. ${clip.title}
                        </h3>
                        
                        <div class="flex items-center gap-3 mt-auto">
                            <a href="/api/download/${clip.id}" target="_blank" 
                               class="gradient-btn text-white text-[13px] font-semibold py-2 px-5 rounded-full shadow-lg flex items-center justify-center">
                                Download
                            </a>
                            <div class="text-[11px] font-medium text-gray-500 uppercase tracking-wide">
                                MP4 | 1080p | ~${Math.round(durationSecs * 0.5)}MB
                            </div>
                        </div>
                    </div>
                `;
                clipsGrid.appendChild(card);
            });
            
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
        }
    </script>
</body>
</html>
